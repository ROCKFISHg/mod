<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Verify</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg-main:#0c0e11;
  --border:#1f242c;

  --mc-green:#5fbf3f;
  --blue-main:#3aa0ff;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:#000;
  font-family:system-ui,Segoe UI,Arial;
}

/* ===== 人机验证 ===== */
#verify{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
}

#verify-box{
  background:var(--bg-main);
  border:2px solid var(--border);
  padding:48px;
  text-align:center;
  position:relative;
  min-width:420px;
}

#verify-title{
  font-size:48px;
  font-weight:700;
  color:var(--mc-green);
  margin-bottom:10px;
}

#verify-sub{
  font-size:14px;
  color:var(--blue-main);
  margin-bottom:30px;
}

/* ===== 按钮 ===== */
.btn{
  padding:14px 28px;
  font-size:16px;
  font-weight:700;
  border-radius:6px;
  border:2px solid transparent;
  cursor:pointer;
  position:absolute;
  transition:all .2s ease;
  box-shadow:0 4px 0 rgba(0,0,0,.6);
}

.btn:hover{ transform:translateY(-3px); }
.btn:active{ transform:translateY(1px); }

.btn-green{
  background:var(--mc-green);
  color:#0b120d;
  border-color:#2f6f1f;
}

.btn-blue{
  background:var(--blue-main);
  color:#041321;
  border-color:#1f5fa0;
}
</style>
</head>

<body>

<div id="verify">
  <div id="verify-box">
    <div id="verify-title">Are you person?</div>
    <div id="verify-sub"><span id="count">0</span> / 10</div>

    <div id="yesBtn" class="btn btn-green">Yes</div>
    <div id="noBtn" class="btn btn-blue">No</div>
  </div>
</div>

<script>
let clicks = 0;
const yes = document.getElementById("yesBtn");
const no = document.getElementById("noBtn");
const count = document.getElementById("count");

function moveYes(){
  const box = document.getElementById("verify-box");
  const rect = box.getBoundingClientRect();

  const centerX = rect.width / 2;
  const centerY = rect.height / 2 + 40;

  const offsetX = (Math.random() - 0.5) * 240;
  const offsetY = (Math.random() - 0.5) * 160;

  yes.style.left = centerX + offsetX + "px";
  yes.style.top  = centerY + offsetY + "px";
}

yes.onclick = () => {
  clicks++;
  count.textContent = clicks;
  moveYes();

  if(clicks >= 10){
    // 跳转到第二个页面 rockfish.html
    window.location.href = "rockfish.html";
  }
};

no.onclick = () => {
  clicks = 0;
  count.textContent = 0;
  moveYes();
};

window.onload = () => {
  moveYes();
  no.style.left = "50%";
  no.style.top = "65%";
  no.style.transform = "translateX(-50%)";
};
</script>

</body>
</html>
