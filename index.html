<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ROCKFISH</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg-main:#0c0e11;
  --bg-panel:#15181e;
  --border:#1f242c;

  --mc-green:#5fbf3f;
  --green-dark:#1f7f4a;

  --blue-main:#3aa0ff;
  --blue-soft:#9fcfff;

  --text-main:#e5e7eb;
  --text-sub:#9aa4b2;
}

*{box-sizing:border-box;}

body{
  margin:0;
  padding:24px;
  background:#000;
  font-family:system-ui,Segoe UI,Arial;
}

.page{
  min-height:calc(100vh - 48px);
  background:var(--bg-main);
  border:2px solid var(--border);
}

/* ===== 标题 ===== */
.hero{
  padding:32px;
  border-bottom:1px solid var(--border);
}

.hero-title{
  margin:0;
}

.hero-title .main{
  display:block;
  font-size:56px;
  font-weight:700;
  color:var(--mc-green);
}

.hero-title .sub{
  display:block;
  font-size:14px;
  color:var(--green-dark);
  margin-top:6px;
}

/* ===== 主体 ===== */
main{
  padding:32px;
  display:grid;
  gap:28px;
}

.panel{
  background:var(--bg-panel);
  border:1px solid var(--border);
  padding:24px;
}

.mod-title{
  font-size:20px;
  font-weight:600;
  color:var(--blue-main);
  margin-bottom:14px;
}

.mod-actions{
  display:flex;
  align-items:center;
  gap:16px;
}

/* ===== 立体按钮 ===== */
.btn{
  padding:14px 28px;
  font-size:16px;
  font-weight:700;
  background:var(--mc-green);
  color:#0b120d;
  border:2px solid #2f6f1f;
  text-decoration:none;
  box-shadow:0 4px 0 #2f6f1f,0 6px 10px rgba(0,0,0,.6);
  border-radius:6px;
  transition: all 0.2s ease;
  display:inline-block;
}
.btn:hover{
  transform: translateY(-3px);
  box-shadow:0 6px 0 #2f6f1f,0 8px 12px rgba(0,0,0,.6);
}
.btn:active{
  transform: translateY(1px);
  box-shadow:0 3px 0 #2f6f1f,0 4px 6px rgba(0,0,0,.6);
}

.info-line{
  font-size:14px;
  color:var(--blue-soft);
  margin-top:16px;
  line-height:1.6;
}

/* ===== 粉色按钮 ===== */
.button-panel{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  margin-top:16px;
}

.square-btn{
  width:60px;
  height:60px;
  background:#ff69b4;
  color:#fff;
  font-weight:700;
  font-size:14px;
  text-align:center;
  line-height:60px;
  border:2px solid #d65ca8;
  box-shadow:0 4px 0 #d65ca8,0 6px 10px rgba(0,0,0,.6);
  text-decoration:none;
  display:inline-block;
  border-radius:4px;
  text-transform: lowercase;
}
.square-btn:hover{
  transform: translateY(-2px);
  box-shadow:0 6px 0 #d65ca8,0 8px 10px rgba(0,0,0,.6);
}
.square-btn:active{
  transform: translateY(1px);
  box-shadow:0 3px 0 #d65ca8,0 4px 6px rgba(0,0,0,.6);
}

footer{
  padding:24px 32px;
  border-top:1px solid var(--border);
  font-size:12px;
  color:var(--text-sub);
}
</style>
</head>

<body>

<div class="page">

  <!-- 标题 -->
  <section class="hero">
    <h1 class="hero-title">
      <span class="main">ROCKFISH</span>
      <span class="sub">is the most handsome fish</span>
      <span class="sub">in the world</span>
    </h1>
  </section>

  <main>

    <!-- Mod 下载 -->
    <div class="panel">
      <div class="mod-title">
        If you want to play ROCKFISH's world, you need to download this Mod
      </div>

      <div class="mod-actions">
        <a href="https://raw.githubusercontent.com/ROCKFISHg/mod/main/mod.zip"
           class="btn"
           download>DOWNLOAD MOD</a>
      </div>
    </div>

    <!-- IP 查询 -->
    <div class="panel">
      <div class="mod-title">Your IP Information</div>

      <div class="mod-actions">
        <a class="btn" href="javascript:void(0)" onclick="getIP()">
          CHECK MY IP
        </a>
      </div>

      <div id="ip-info" class="info-line">
        Click the button to view your IP address
      </div>
    </div>

    <!-- 其他链接 -->
    <div class="panel">
      <div class="mod-title">Other Links</div>
      <div class="button-panel">
        <a href="https://space.bilibili.com/3546618020236006?spm_id_from=333.1007.0.0"
           target="_blank"
           class="square-btn">blibli</a>
      </div>
    </div>

  </main>

  <footer>© ROCKFISH</footer>

</div>

<script>
function getIP(){
  const box = document.getElementById("ip-info");
  box.textContent = "Loading...";

  fetch("https://ipapi.co/json/")
    .then(res => res.json())
    .then(data => {
      box.innerHTML = `
        IP Address: <strong>${data.ip}</strong><br>
        Country: <strong>${data.country_name}</strong><br>
        City: <strong>${data.city}</strong><br>
        ISP: <strong>${data.org ?? "Unknown"}</strong>
      `;
    })
    .catch(() => {
      box.textContent = "Failed to load IP information.";
    });
}
</script>

</body>
</html>
