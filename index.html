<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>vROCKFISHv Mods</title>
<style>
body { font-family: Arial; background:#121212; color:#eee; padding:20px; }
h1 { color:#ff9800; }
button { background:#4CAF50; color:white; padding:10px 20px; border:none; border-radius:5px; font-size:18px; cursor:pointer; }
button:hover { background:#45a049; }
</style>
</head>
<body>
<h1>欢迎来到 vROCKFISHv Mods</h1>
<p>点击下面按钮下载所有 Mod：</p>
<button id="downloadAll">下载全部 Mod</button>

<script>
// 所有 Mod 文件路径
const mods = [
  './mods/mod1.jar',
  './mods/mod2.jar',
  './mods/mod3.jar'
];

document.getElementById('downloadAll').addEventListener('click', () => {
  mods.forEach(file => {
    const a = document.createElement('a');
    a.href = file;
    a.download = file.split('/').pop();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
});
</script>

</body>
</html>
